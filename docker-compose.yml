services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widgets
      POSTGRES_PASSWORD: widgets
      POSTGRES_DB: widgets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgets -d widgets"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
